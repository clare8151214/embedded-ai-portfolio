; W03 - Timing, Timers & Sampling Jitter
; UPDATED 23 Sep: the boards that arrived are ESP32-S3-DevKitC-1 (N16R8),
; not XIAO ESP32-S3. The board line changed. Everything else is the same.

[env:esp32-s3-devkitc-1]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; The monitor writes everything it receives to a .log file in this folder,
; while still showing it on screen. You never select text with the mouse,
; and nothing can scroll off the top and be silently lost.
monitor_filters = log2file

; ---------------------------------------------------------------------------
; THE USB PORT QUESTION - read this before you plug in.
; This board has TWO USB-C sockets. The original lab default uses UART0,
; through the USB-serial bridge (used for the saved A/B/C measurements).
; 2026-09-30, Sketch D: the connected device is native USB Serial/JTAG.
; Enable Serial on that USB socket. Comment this flag out to return to UART0.
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
; ---------------------------------------------------------------------------
