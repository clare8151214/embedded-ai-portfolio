; W05 - Bus Interfaces: I2C, SPI, UART and an IMU
; The same six lines as W03. Nothing here changes during the session.

; UPDATED 23 Sep: the boards that arrived are ESP32-S3-DevKitC-1 (N16R8),
; not XIAO ESP32-S3. The board line changed. Everything else is the same.
[env:esp32-s3-devkitc-1]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; The monitor writes everything it receives to a .log file in this folder while still
; showing it on screen. You never select text with the mouse, and nothing can scroll
; off the top and be silently lost.
monitor_filters = log2file
